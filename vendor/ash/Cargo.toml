[package]
name = "ash"
version = "0.38.0+1.3.281"
edition = "2021"
rust-version = "1.69"
license = "MIT OR Apache-2.0"
description = "Vulkan bindings (vendored offline subset of upstream packaging)"
repository = "https://github.com/ash-rs/ash"

[features]
default = ["std", "debug"]
std = []
debug = []
linked = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("loaded"))'] }
